info:
  name: Get Health
  type: http
  seq: 1
  tags:
    - health

http:
  method: GET
  url: "{{baseUrl}}/health"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/health"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": "",
            "database": ""
          }
  - name: 503 Response
    description: Database unreachable
    request:
      url: "{{baseUrl}}/health"
      method: GET
    response:
      status: 503
      statusText: Service Unavailable
      body:
        type: text
        data: ""
